name: Aktualizovat ceny nabíjení

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-charging-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Připravit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: price_robot/requirements.txt

      - name: Nainstalovat parser PDF
        run: pip install -r price_robot/requirements.txt

      - name: Spustit testy robota
        run: python -m unittest discover -s price_robot/tests -v

      - name: Ověřit a vytvořit nový ceník
        run: python price_robot/price_robot.py --output prices.json

      - name: Publikovat pouze ověřenou změnu
        run: |
          if git diff --quiet -- prices.json; then
            echo "Ceník už je aktuální."
            exit 0
          fi
          git config user.name "Tesla Charging Price Robot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git commit -m "Automatická kontrola cen"
          git push
